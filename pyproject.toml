[project]
name = "azure-agent-labs"
version = "0.1.0"
description = "Five offline, end-to-end Azure agent labs on Microsoft Agent Framework and Azure AI Foundry (mocked): hazard signal fusion, retinal-scan research triage, road maintenance planning, contract compliance and turbine continual learning."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jagadish Meduri" }]
requires-python = ">=3.11"
# Resolved and installed on 2026-09-29. The Azure SDKs are NOT dependencies: every Azure adapter is a
# stub that raises until it is wired up, so the labs install and run with no cloud packages at all.
dependencies = [
  "agent-framework-core==1.19.0",
  "mcp==2.2.0",
  "pydantic>=2.13,<3",
  "networkx==3.7",
  "numpy>=2.2,<3",
  "scikit-learn==1.9.1",
  "opentelemetry-sdk>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "shared/labcore",
  "labs/disaster-signal-fusion/src/signal_fusion",
  "labs/medical-eye-scan-multimodal/src/eyescan",
  "labs/road-network-maintenance-graph/src/roadgraph",
  "labs/legal-document-compliance/src/legalcomp",
  "labs/wind-turbine-continual-learning/src/turbine_cl",
]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "labs"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
pythonpath = [
  "shared",
  "labs/disaster-signal-fusion/src",
  "labs/medical-eye-scan-multimodal/src",
  "labs/road-network-maintenance-graph/src",
  "labs/legal-document-compliance/src",
  "labs/wind-turbine-continual-learning/src",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = [
  "shared",
  "scripts",
  "labs/disaster-signal-fusion/src",
  "labs/medical-eye-scan-multimodal/src",
  "labs/road-network-maintenance-graph/src",
  "labs/legal-document-compliance/src",
  "labs/wind-turbine-continual-learning/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501"]
