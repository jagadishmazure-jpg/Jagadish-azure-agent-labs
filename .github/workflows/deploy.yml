# Deploy the lab infrastructure: dev -> (approval) -> prod, with either Bicep or Terraform.
#
# GATED OFF: every job except `preflight` runs only when the repository variable
# DEPLOY_ENABLED == 'true'. It is not set, so on push to main this workflow reports the gate and
# skips the deploy jobs. See docs/deployment.md for the one-time setup (OIDC federated
# credentials, GitHub Environments `dev` and `prod` with required reviewers, state storage).
#
# The labs are offline demos with no long-running service, so there is no image to build: the
# pipeline provisions each lab's Azure footprint and smoke-tests it (resources exist, Foundry
# endpoint reachable, key auth disabled). Azure login is OIDC only; no client secret exists.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lab:
        description: "Lab to deploy"
        type: choice
        options: [all, disaster-signal-fusion, legal-document-compliance, medical-eye-scan-multimodal, road-network-maintenance-graph, wind-turbine-continual-learning]
        default: all
      deploy_tool:
        description: "IaC tool"
        type: choice
        options: [terraform, bicep]
        default: terraform
      promote_to_prod:
        description: "Continue to prod after dev (prod still waits for reviewer approval)"
        type: boolean
        default: true
      location:
        description: "Azure region"
        type: string
        default: eastus2
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
env:
  DEPLOY_TOOL: ${{ inputs.deploy_tool || vars.DEPLOY_TOOL || 'terraform' }}
  LOCATION: ${{ inputs.location || vars.AZURE_LOCATION || 'eastus2' }}
  TF_VERSION: "1.16.4"
jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      labs: ${{ steps.labs.outputs.labs }}
    steps:
      - name: Report deploy gate
        env:
          ENABLED: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: |
          {
            echo "### Deploy gate"
            echo "- DEPLOY_ENABLED: \`${ENABLED}\` (deploy jobs run only when this is true)"
            echo "- deploy tool: \`${DEPLOY_TOOL}\`, region: \`${LOCATION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$ENABLED" == "true" ]] || echo "::notice::Deployment disabled (repository variable DEPLOY_ENABLED is not 'true'); deploy jobs are skipped."
      - name: Labs to deploy
        id: labs
        env:
          CHOICE: ${{ inputs.lab || 'all' }}
        run: |
          if [[ "$CHOICE" == "all" ]]; then
            echo 'labs=["disaster-signal-fusion","legal-document-compliance","medical-eye-scan-multimodal","road-network-maintenance-graph","wind-turbine-continual-learning"]' >> "$GITHUB_OUTPUT"
          else
            echo "labs=[\"$CHOICE\"]" >> "$GITHUB_OUTPUT"
          fi

  deploy-dev:
    needs: preflight
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        lab: ${{ fromJSON(needs.preflight.outputs.labs) }}
    permissions:
      contents: read
      id-token: write
    env:
      LAB: ${{ matrix.lab }}
      TARGET_ENV: dev
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Provision ${{ matrix.lab }} (${{ env.DEPLOY_TOOL }})
        id: provision
        run: .github/scripts/deploy.sh provision
      - name: Smoke tests
        env:
          RESOURCE_GROUP: ${{ steps.provision.outputs.resource_group }}
          FOUNDRY_ENDPOINT: ${{ steps.provision.outputs.foundry_endpoint }}
        run: .github/scripts/deploy.sh smoke

  deploy-prod:
    needs: [preflight, deploy-dev]
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.promote_to_prod)
    runs-on: ubuntu-latest
    environment: prod # required reviewers are configured on this environment
    strategy:
      fail-fast: false
      matrix:
        lab: ${{ fromJSON(needs.preflight.outputs.labs) }}
    permissions:
      contents: read
      id-token: write
    env:
      LAB: ${{ matrix.lab }}
      TARGET_ENV: prod
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Provision ${{ matrix.lab }} (${{ env.DEPLOY_TOOL }})
        id: provision
        run: .github/scripts/deploy.sh provision
      - name: Smoke tests
        env:
          RESOURCE_GROUP: ${{ steps.provision.outputs.resource_group }}
          FOUNDRY_ENDPOINT: ${{ steps.provision.outputs.foundry_endpoint }}
        run: .github/scripts/deploy.sh smoke
