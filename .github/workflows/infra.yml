# Infrastructure CI for the five lab stacks: runs on every pull request and on main. Nothing here
# touches Azure unless OIDC variables exist, and even then it only plans.
#   terraform fmt / init -backend=false / validate / test (mocked providers), per lab
#   tflint (skipped with a warning if it cannot be installed)
#   checkov security scan (config: .checkov.yaml; unlisted findings fail the job)
#   terraform plan: only when AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID are set
name: infra
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true
env:
  TF_VERSION: "1.16.4"
  TF_IN_AUTOMATION: "1"
jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab: [disaster-signal-fusion, legal-document-compliance, medical-eye-scan-multimodal, road-network-maintenance-graph, wind-turbine-continual-learning]
    env:
      STACK: labs/${{ matrix.lab }}/infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - name: terraform fmt (lab stack + shared modules)
        run: terraform fmt -check -recursive -diff "$STACK" && terraform fmt -check -recursive -diff infra/terraform
      - name: terraform init (no backend)
        run: terraform -chdir="$STACK" init -backend=false -input=false
      - name: terraform validate
        run: terraform -chdir="$STACK" validate
      - name: terraform test (offline plan with mocked providers)
        run: terraform -chdir="$STACK" test

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        id: setup
        continue-on-error: true
        with: { tflint_version: v0.64.0, github_token: "${{ github.token }}" }
      - name: tflint (every lab, modules included)
        if: steps.setup.outcome == 'success'
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          for d in labs/*/infra/terraform; do
            echo "== $d"
            (cd "$d" && tflint --init && tflint --call-module-type=all --format compact) || exit 1
          done
      - name: tflint unavailable
        if: steps.setup.outcome != 'success'
        run: echo "::warning::tflint could not be installed; lint skipped (validate still enforced)"

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet checkov==3.3.20
      - name: checkov (Terraform)
        run: checkov -d . --config-file .checkov.yaml

  plan:
    needs: terraform
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Azure credentials present?
        id: creds
        run: |
          if [[ -n "$ARM_CLIENT_ID" && -n "$ARM_TENANT_ID" && -n "$ARM_SUBSCRIPTION_ID" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::terraform plan skipped: no Azure OIDC variables configured (fmt/validate/test/tflint/checkov still enforced)"
            echo "### terraform plan skipped (no Azure credentials configured)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'
      - uses: hashicorp/setup-terraform@v3
        if: steps.creds.outputs.present == 'true'
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - uses: azure/login@v2
        if: steps.creds.outputs.present == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: terraform plan (dev, every lab; local state)
        if: steps.creds.outputs.present == 'true'
        run: |
          for d in labs/*/infra/terraform; do
            printf 'terraform {\n  backend "local" {}\n}\n' > "$d/backend_override.tf"
            terraform -chdir="$d" init -input=false
            terraform -chdir="$d" plan -input=false -lock=false -var-file=envs/dev.tfvars -no-color | tee -a plan.txt
          done
          { echo '### terraform plan (dev)'; echo '```'; grep -E '^Plan:|^No changes' plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
