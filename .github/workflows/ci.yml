name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Agent cards are current
        run: python scripts/export_agent_cards.py --check
      - name: Secrets scan
        run: python scripts/secrets_scan.py
      - name: Docs match code and output
        run: python scripts/doc_drift.py --check

  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Shared layer tests
        run: pytest -q shared/tests

  lab:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab:
          - disaster-signal-fusion
          - medical-eye-scan-multimodal
          - road-network-maintenance-graph
          - legal-document-compliance
          - wind-turbine-continual-learning
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Tests (offline, mocks)
        run: pytest -q labs/${{ matrix.lab }}
      - name: Eval gate
        run: python labs/${{ matrix.lab }}/evals/run_eval.py --out evals-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: "eval-${{ matrix.lab }}", path: evals-out }

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Bicep CLI (skip gracefully if unavailable)
        id: install
        continue-on-error: true
        run: |
          curl -fsSLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep && sudo mv bicep /usr/local/bin/bicep && bicep --version
      - name: Build every lab's infra (compile only, never deployed)
        if: steps.install.outcome == 'success'
        run: for f in labs/*/infra/main.bicep; do echo "$f"; bicep build "$f" --stdout > /dev/null; done
      - name: Bicep not available
        if: steps.install.outcome != 'success'
        run: echo "::warning::Bicep CLI could not be installed; infra build skipped"

  secrets:
    # gitleaks over the full git history. Known false positives (public role IDs, synthetic
    # attack fixtures) are listed by fingerprint in .gitleaksignore.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
